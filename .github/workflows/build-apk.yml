name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create releases / upload assets on tag builds

env:
  GODOT_VERSION: 4.7.2-stable
  # Godot dir name inside the templates tpz / editor settings
  GODOT_TEMPLATE_DIR: 4.7.2.stable.mono

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-24.04 ships the Android SDK preinstalled at $ANDROID_SDK_ROOT with
      # build-tools and platforms 34/35 already present — just accept licenses.
      - name: Android SDK licenses
        run: yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Cache Godot editor + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot/godot
            ~/godot/GodotSharp
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-v2

      - name: Download Godot (mono) + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -sL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          curl -sL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}_mono_export_templates.tpz"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          # GodotSharp glue lives next to the binary
          mv Godot_v${GODOT_VERSION}_mono_linux_x86_64/GodotSharp ~/godot/GodotSharp
          unzip -q templates.tpz
          mv templates ~/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}

      - name: Configure Godot editor settings (Android export)
        # Uses the debug keystore COMMITTED at android/debug.keystore — not a fresh
        # one generated per run. A freshly-generated debug keystore was the actual
        # root cause of "every update needs an uninstall + reinstall": every CI run
        # signed the APK with a brand new random key, and Android refuses to install
        # an "update" whose signing certificate doesn't match the one already on the
        # device. Same key every build = same key as this dev machine's own
        # ~/.android/debug.keystore (committed from here) = updates actually work.
        # It's a debug key (never used for a Play Store release — this app is
        # sideload-only, see CLAUDE.md) so committing it carries the usual debug-key
        # caveats, not production-signing ones.
        run: |
          set -e
          mkdir -p ~/.config/godot
          JAVA_DIR="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_DIR}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Build C# project (generates GodotSharp API assemblies)
        run: dotnet build Sentinel.csproj -v q

      - name: Import project
        run: ~/godot/godot --headless --path . --import || true

      - name: Determinism / sim check
        run: ~/godot/godot --headless --path . scenes/SimTest.tscn --quit

      - name: Set up Android custom Gradle build
        # android/build/ isn't committed (it's ~200MB, almost entirely Godot's own
        # prebuilt libs — regenerable, same idea as export_templates). This unzips
        # the cached export template's android_source.zip fresh and layers
        # android/overlay/ (our own small in-app-updater additions) on top —
        # needed for the FileProvider + REQUEST_INSTALL_PACKAGES permission a plain
        # (non-Gradle) APK export can't add. See tools/setup_android_gradle.sh.
        run: bash tools/setup_android_gradle.sh

      - name: Export Android APK
        run: |
          set -e
          mkdir -p build
          ~/godot/godot --headless --path . --export-debug "Android" build/beyond-debug.apk
          test -f build/beyond-debug.apk
          ls -la build/

      - name: Version stamp
        id: ver
        run: echo "name=beyond-$(date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: build/beyond-debug.apk
          if-no-files-found: error

      # Build the release as a DRAFT, attach the APK, verify it's really there, and only
      # then publish. Ordering matters and both wrong orders have bitten this project:
      #
      #  * softprops/action-gh-release@v2 (draft -> upload -> publish) left the release a
      #    permanent invisible draft whenever the ~200MB upload failed, because its
      #    publish step never ran. v0.31.2/v0.32.0/v0.33.0 were all stranded that way,
      #    and since /releases/latest skips drafts the in-app updater saw nothing new.
      #
      #  * Creating it published first (the v0.34.0 attempt) is worse: the release —
      #    and therefore the updater and the Releases page — advertises a download for
      #    the whole duration of the upload, and anyone who taps it in that window gets
      #    a dead link. That is exactly what happened on v0.34.0.
      #
      # So: draft, upload with retries, assert the asset is present and non-zero, publish
      # last. If the upload can't be completed the draft is deleted, so a failed run
      # leaves nothing behind rather than a stranded draft or an empty published release.
      - name: Build draft release, attach APK, then publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l build/beyond-debug.apk

          # Start clean: drop any release left over from an earlier attempt at this tag
          # (keep the tag itself — it's already pushed).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "removing existing release for $TAG"
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --draft --title "$TAG" --notes "Automated build for $TAG"

          uploaded=0
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" build/beyond-debug.apk --clobber; then
              # gh can exit 0 on a partial upload, so confirm the asset is actually
              # there and matches the file on disk before trusting it.
              want=$(stat -c%s build/beyond-debug.apk)
              got=$(gh release view "$TAG" --json assets \
                    --jq '.assets[] | select(.name=="beyond-debug.apk") | .size' || echo 0)
              if [ "${got:-0}" = "$want" ]; then
                echo "asset verified on attempt $attempt ($got bytes)"
                uploaded=1
                break
              fi
              echo "asset size mismatch on attempt $attempt (want $want, got ${got:-0})"
            fi
            echo "upload attempt $attempt failed, retrying in 30s..."
            sleep 30
          done

          if [ "$uploaded" != 1 ]; then
            echo "::error::APK upload failed after 5 attempts — deleting the draft so nothing half-made is left behind"
            gh release delete "$TAG" --yes || true
            exit 1
          fi

          # Only now does it become visible to players and to the in-app updater.
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json isDraft,assets \
            --jq '"PUBLISHED isDraft=\(.isDraft) assets=\(.assets | map(.name + " " + (.size|tostring)) | join(", "))"'
